<!DOCTYPE html>
<html lang="en">

<head>
  {% block title %}<title>Local Library</title>{% endblock %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
    integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
  <!-- Add additional CSS in static file -->
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-2">
        {% block sidebar %}
        <ul class="sidebar-nav">
          <li>
            <a href="{% url 'index' %}" class="{% if request.path == '/catalog/' %}active{% endif %}">
              Home
            </a>
          </li>
          <li>
            <a href="#" class="{% if '/all-courses/' in request.path %}active{% endif %}">
              All courses
            </a>
          </li>

          <li>
            <a href="#" class="{% if '/departments/' in request.path %}active{% endif %}">
              Departments
            </a>
          </li>

          <li>
            <a href="#" class="{% if '/profesors/' in request.path %}active{% endif %}">
              Professors
            </a>
          </li>

          <li>
            <a href="#" class="{% if '/students/' in request.path %}active{% endif %}">
              Students
            </a>
          </li>
        </ul>
        {% endblock %}
      </div>
      <div class="col-sm-10 ">{% block content %}{% endblock %}</div>
    </div>
  </div>
</body>

</html>
